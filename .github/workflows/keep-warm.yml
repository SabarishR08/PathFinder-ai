name: Keep Backend Warm

# Pings the deployed Render backend every 10 minutes so the free-tier
# instance never fully spins down (Render sleeps after ~15 min idle).
# Judges may access the app asynchronously with no fixed time slot,
# so this keeps cold-start latency (30-50s) from ever being hit.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, all day, every day
  workflow_dispatch:          # allows manual trigger from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf https://YOUR-RENDER-URL.onrender.com/health || echo "Ping failed (backend may be redeploying)"
