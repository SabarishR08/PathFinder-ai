services:
  - type: web
    name: pathfinder-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard — never commit real keys
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel frontend URL after it's deployed
